name: Microsoft Azure App Service Deployment

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Azure Web App Name"
        required: true
        default: "MLSentinel"
      resource_group:
        description: "Azure Resource Group Name"
        required: true
        default: "azureai"
      location:
        description: "Azure Region"
        required: true
        default: "westus3"

jobs:
  deploy-to-azure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Deploy with Publish Profile
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.app_name }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          startup-command: 'bash azure/startup.sh'

      - name: Log in to Azure & Deploy via CLI
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Provision & Deploy via Python script
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '' }}
        run: |
          python3 azure/deploy_azure.py \
            --resource-group ${{ inputs.resource_group }} \
            --app-name ${{ inputs.app_name }} \
            --location ${{ inputs.location }}


