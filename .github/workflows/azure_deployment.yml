name: Microsoft Azure App Service Deployment

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Azure Web App Name"
        required: true
        default: "MLSentinel"
      resource_group:
        description: "Azure Resource Group Name"
        required: true
        default: "azureai"
      location:
        description: "Azure Region"
        required: true
        default: "westus3"

jobs:
  deploy-to-azure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Deploy using Publish Profile
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.app_name }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

      - name: Log in to Azure (fallback to AZURE_CREDENTIALS)
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '' && secrets.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy via Python script (fallback)
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '' && secrets.AZURE_CREDENTIALS != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install azure-mgmt-web azure-identity azure-mgmt-resource
          python azure/deploy_azure.py \
            --resource-group ${{ inputs.resource_group }} \
            --app-name ${{ inputs.app_name }} \
            --location ${{ inputs.location }}
