name: Microsoft Azure App Service Deployment

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Azure Web App Name (Globally Unique)"
        required: true
        default: "ml-sentinel-app"
      resource_group:
        description: "Azure Resource Group Name"
        required: true
        default: "ml-sentinel-rg"
      location:
        description: "Azure Region"
        required: true
        default: "eastus"

jobs:
  deploy-to-azure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Provision & Deploy to Azure Web App
        run: |
          python3 azure/deploy_azure.py \
            --resource-group ${{ inputs.resource_group }} \
            --app-name ${{ inputs.app_name }} \
            --location ${{ inputs.location }}

